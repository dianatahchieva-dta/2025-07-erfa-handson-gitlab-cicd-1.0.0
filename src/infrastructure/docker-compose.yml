services:
  gitlab:
    image: gitlab/gitlab-ce:18.0.1-ce.0
    container_name: custom-gitlab
    restart: always
    hostname: gitlab.local
    ports:
      - "8000:8000"
      - "2222:22"
    volumes:
      - ./configuration/config:/etc/gitlab
      - ./configuration/data:/var/opt/gitlab
    networks:
      - gitlab-net
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8000'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
      GITLAB_ROOT_PASSWORD: YourSecurePassword
    shm_size: '256m'

  gitlab-runner:
    image: gitlab/gitlab-runner:v18.0.2
    container_name: gitlab-runner
    restart: always
    depends_on:
      - gitlab
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./configuration/gitlab_runner_config:/etc/gitlab-runner
    networks:
      - gitlab-net

networks:
  gitlab-net:
