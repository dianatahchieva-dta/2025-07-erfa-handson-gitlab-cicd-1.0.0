stages:
  - deploy

deploy-staging:
  stage: deploy
  script:
    - echo "Deploying to staging..."
  environment:
    name: staging
    url: https://staging.example.com
    on_stop: stop-staging

stop-staging:
  stage: deploy
  script:
    - echo "Stopping staging environment..."
  environment:
    name: staging
    action: stop
  when: manual
